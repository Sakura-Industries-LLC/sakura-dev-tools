name = "tinymist"
type = "cli"

[platform.linux]
download-file = "tinymist-{arch}-unknown-linux-{libc}.tar.gz"
checksum-file = "tinymist-{arch}-unknown-linux-{libc}.tar.gz.sha256"
exe-path = "tinymist-{arch}-unknown-linux-{libc}/tinymist"

[platform.macos]
download-file = "tinymist-{arch}-apple-darwin.tar.gz"
checksum-file = "tinymist-{arch}-apple-darwin.tar.gz.sha256"
exe-path = "tinymist"

[platform.windows]
download-file = "tinymist-{arch}-pc-windows-msvc.zip"
checksum-file = "tinymist-{arch}-pc-windows-msvc.zip.sha256"
exe-path = "tinymist.exe"

[install]
download-url = "https://github.com/Myriad-Dreamin/tinymist/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/Myriad-Dreamin/tinymist/releases/download/v{version}/{checksum_file}"

[install.arch]
aarch64 = "aarch64"
x86_64 = "x86_64"

[resolve]
git-url = "https://github.com/Myriad-Dreamin/tinymist"
