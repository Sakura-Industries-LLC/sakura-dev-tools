# Exact tool versions for the container. Refresh with just outdated-update.
[tools]
"java" = "temurin-21.0.13+9.0.LTS"
"aqua:gradle/gradle-distributions" = "9.9.0"
"aqua:casey/just" = "1.59.0"
"github:moonrepo/moon" = { version = "2.6.5", matching = "moon_cli-", rename_exe = "moon" }
"github:git-lfs/git-lfs" = { version = "3.8.1", strip_components = 1, bin_path = ".", matching = "linux-", filter_bins = "git-lfs" }
"aqua:rvben/rumdl" = "0.3.2"
"node" = "26.13.0"
"npm:npm" = "12.2.2"
"rust" = { version = "1.99.1", profile = "default" }
"go" = "1.27.3"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:vektra/mockery" = "3.9.0"
"github:CycloneDX/cyclonedx-gomod" = "1.12.0"
"github:quarto-dev/quarto-cli" = { version = "1.11.9", strip_components = 1, bin_path = "bin", matching = "linux-" }
"aqua:gohugoio/hugo" = "0.169.0"
"aqua:sass/dart-sass" = "1.108.1"
"aqua:getzola/zola" = "0.23.6"
"github:jgm/pandoc" = { version = "3.13", strip_components = 1, bin_path = "bin", matching = "linux-" }
"aqua:typst/typst" = "0.15.1"
"aqua:typstyle-rs/typstyle" = "0.15.2"
"aqua:Myriad-Dreamin/tinymist" = "0.15.12"
"github:Myriad-Dreamin/tinymist" = { version = "0.15.12", matching = "typlite-", filter_bins = "typlite" }
"github:ewhauser/shuck" = { version = "0.2.7", matching = "shuck-cli-" }
"python" = "3.15.2"
"zig" = "0.17.1"
"aqua:opentofu/opentofu" = "1.13.9"
"aqua:zellij-org/zellij" = "0.45.1"
"aqua:max-sixty/worktrunk" = "0.81.0"
"npm:cspell" = "10.4.1"
"npm:oxlint" = "1.92.0"
"npm:oxfmt" = "0.77.0"
"npm:tree-sitter-cli" = "0.27.2"
"npm:typescript-language-server" = "6.0.3"
"npm:yaml-language-server" = "2.0.0"
"aqua:cargo-bins/cargo-binstall" = "1.26.2"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:astral-sh/ruff" = "0.17.4"
"aqua:astral-sh/uv" = "0.13.7"
"aqua:astral-sh/ty" = "0.0.99"

# The Wails CLI is a pure-Go build tool, but with cgo enabled its Linux build
# compiles an optional WebKit version probe that needs the GTK4 and WebKitGTK
# 6.0 development packages. Installing it without cgo keeps this tool
# installable everywhere, including the Linux CI agent, which has no GTK.
# Building the desktop application on Linux still needs those packages; the
# `linux:build` task checks for them.
"go:github.com/wailsapp/wails/v3/cmd/wails3" = { version = "3.1.0", os = ["macos", "linux"], install_env = { CGO_ENABLED = "0" } }

[settings]
lockfile = false
auto_install = false
activate_shims = false
